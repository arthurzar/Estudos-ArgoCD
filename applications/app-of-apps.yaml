apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  project: default
  source:
    helm: {}
    repoURL: "https://github.com/arthurzar/Estudos-ArgoCD.git"
    targetRevision: feat/day2
    path: app-of-apps
  destination:
    namespace: argocd
    server: "https://kubernetes.default.svc"
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
