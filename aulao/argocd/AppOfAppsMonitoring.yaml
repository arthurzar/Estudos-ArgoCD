apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps-monitoring
  namespace: argocd-prd
spec:
  project: default
  source:
    repoURL: "https://github.com/arthurzar/Estudos-ArgoCD.git"
    targetRevision: feat/day2
    path: app-of-apps-monitoring
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: argocd.prometheus.enabled
          value: "true"
        - name: argocd.prometheus.ingress
          value: "prometheus.bernardolopes.com"
        - name: argocd.grafana.enabled
          value: "true"
        - name: argocd.grafana.ingress
          value: "grafana.bernardolopes.com"
  destination:
    namespace: argocd-prd
    server: "https://kubernetes.default.svc"
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
